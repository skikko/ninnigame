<script>
'use strict';
/* ============================================================
   HOOP LAGOON
   Coordinate logiche: 1000 x 470 (orizzontale). In verticale il
   gioco viene ruotato di 90° dentro il canvas.
   ============================================================ */

const W = 1000, H = 470;
const CELL = 11, N = 60, M = 36;                      // griglia del fluido
const TANK = { x: 170, y: 37, w: N * CELL, h: M * CELL };
const TB = TANK.y + TANK.h;                           // fondo vasca
const R = 15;                                         // raggio anello
const G = 260;                                        // "peso" in acqua (px/s^2)
const DRAG = 4.5;                                     // quanto l'acqua trascina gli anelli
const JET = 170;                                       // velocità getto (celle/s)
const DT = 1 / 60;
const SLOSH = 160;                                     // quanto gli scossoni muovono l'acqua
const FUNNEL = 7;                                       // aiuto a centrare l'anello sulla punta
const PUMP_STROKE = 0.9;                                // secondi di getto a piena forza
const PUMP_REFILL = 0.45;                               // secondi per ricaricare la pompa

/* ---------------- Livelli ---------------- */
const TIME_LIMIT = 120;                                 // secondi per livello
const NOZZLES = [{ x: 0.14, dx: 0.5 }, { x: 0.86, dx: -0.5 }];   // getti: sinistra e destra, inclinati verso il centro
const LEVELS = [
  { rings: 18, min: 5, fish: 5, fishSpeed: 1,      // come il gioco vero
    pegs: [{ x: 0.36, tip: 0.40, base: 0.74 }, { x: 0.66, tip: 0.30, base: 0.74 }] },
  { rings: 18, min: 5, fish: 5, fishSpeed: 1.1,    // tre razzi
    pegs: [{ x: 0.30, tip: 0.42, base: 0.74 }, { x: 0.50, tip: 0.30, base: 0.74 }, { x: 0.70, tip: 0.42, base: 0.74 }] },
  { rings: 18, min: 5, fish: 7, fishSpeed: 1.3,    // razzi alti e lontani
    pegs: [{ x: 0.28, tip: 0.30, base: 0.74 }, { x: 0.72, tip: 0.22, base: 0.74 }] },
  { rings: 16, min: 5, fish: 9, fishSpeed: 1.6,    // un solo razzo e tanti pesci
    pegs: [{ x: 0.50, tip: 0.28, base: 0.74 }] },
  { rings: 18, min: 5, fish: 6, fishSpeed: 1.2, gyre: 1,   // corrente che gira in tondo
    pegs: [{ x: 0.33, tip: 0.36, base: 0.74 }, { x: 0.67, tip: 0.36, base: 0.74 }] },
];
const GAME_NAME = 'Hoop Lagoon';
const STR = {
  en: {
    level: 'Level {0}', goalToast: '{0}: land at least {1} rings in 2 minutes',
    rings: 'RINGS', time: 'TIME', goal: 'GOAL {0}', goalOk: '\u2714 GOAL OK', best: 'best: {0} rings',
    tag1: 'Press the buttons to pump the water: you have 2 minutes',
    tagMobile: 'to land at least {0} rings on the rockets. Tilt and shake your phone!',
    tagDesk: 'to land at least {0} rings on the rockets. Keys: \u2190 / A  and  \u2192 / D',
    play: 'PLAY', timeUp: "TIME'S UP!", perfect: 'PERFECT!', allDone: 'ALL DONE!', cleared: 'LEVEL CLEARED!',
    landed: 'Rings landed: {0} / {1}', newBest: 'new best!', needed: 'You needed at least {0} to unlock the next level',
    allIn: 'All rings in {0}!', everyLevel: 'You cleared every level!',
    retry: 'RETRY', next: 'NEXT \u25B6', fromStart: 'LEVEL 1', video: '\u25B6 VIDEO: +30 s',
    bonus: '+30 seconds!', adFail: 'No video available right now',
    fsAlready: 'Already full screen', motionOn: 'Phone motion on', motionOff: 'Phone motion off',
    motionDenied: 'Motion blocked: close Safari, reopen it and tap \u201cAllow\u201d', motionNone: 'This device sends no motion data',
    hintTitle: 'Full screen on iPhone', hint1: '1.  In Safari tap the Share button  \u2B06', hint2: '2.  Choose \u201cAdd to Home Screen\u201d',
    hint3: '3.  Open Hoop Lagoon from the icon: no bars', hintClose: 'Tap to close',
  },
  it: {
    level: 'Livello {0}', goalToast: '{0}: infila almeno {1} anelli in 2 minuti',
    rings: 'ANELLI', time: 'TEMPO', goal: 'OBIETTIVO {0}', goalOk: '\u2714 OBIETTIVO OK', best: 'record: {0} anelli',
    tag1: 'Premi i tasti per soffiare l\u2019acqua: hai 2 minuti',
    tagMobile: 'per infilare almeno {0} anelli sui razzi. Inclina e scuoti il telefono!',
    tagDesk: 'per infilare almeno {0} anelli sui razzi. Tasti: \u2190 / A  e  \u2192 / D',
    play: 'GIOCA', timeUp: 'TEMPO SCADUTO!', perfect: 'PERFETTO!', allDone: 'HAI FINITO!', cleared: 'LIVELLO SUPERATO!',
    landed: 'Anelli infilati: {0} / {1}', newBest: 'nuovo record!', needed: 'Ne servivano almeno {0} per passare al livello successivo',
    allIn: 'Tutti gli anelli in {0}!', everyLevel: 'Hai superato tutti i livelli!',
    retry: 'RIPROVA', next: 'AVANTI \u25B6', fromStart: 'LIVELLO 1', video: '\u25B6 VIDEO: +30 s',
    bonus: '+30 secondi!', adFail: 'Nessun video disponibile ora',
    fsAlready: 'Sei gi\u00e0 a tutto schermo', motionOn: 'Movimento del telefono attivo', motionOff: 'Movimento del telefono spento',
    motionDenied: 'Movimento non consentito: chiudi Safari, riaprilo e tocca \u201cConsenti\u201d', motionNone: 'Questo dispositivo non invia i dati di movimento',
    hintTitle: 'A tutto schermo su iPhone', hint1: '1.  In Safari tocca il tasto Condividi  \u2B06', hint2: '2.  Scegli \u201cAggiungi alla schermata Home\u201d',
    hint3: '3.  Apri Hoop Lagoon dall\u2019icona: niente barre', hintClose: 'Tocca per chiudere',
  },
};
let LANG = 'en';
function setLang(loc) { LANG = String(loc || '').toLowerCase().startsWith('it') ? 'it' : 'en'; document.documentElement.lang = LANG; }
try { setLang(navigator.language); } catch (e) {}
function t(k, ...a) { const str = (STR[LANG] && STR[LANG][k]) || STR.en[k] || k; return str.replace(/\{(\d)\}/g, (_, i) => a[i]); }
function levelName(i) { return t('level', i + 1); }

const PROMO = (() => { try { return new URLSearchParams(location.search).has('promo'); } catch (e) { return false; } })();
const COLORS = ['#ff8fc7', '#ffe14d', '#8fd0ff', '#c9a2ff'];
// Fissati dallo script di build (tools/build.mjs). 'auto' = sorgente e GitHub Pages:
// l'SDK CrazyGames si attiva solo quando il gioco gira davvero su CrazyGames.
const PLATFORM = 'auto';               // auto | crazygames | gamedistribution | none
const GD_GAME_ID = '';                 // id del gioco nel pannello GameDistribution
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const TOUCH = (navigator.maxTouchPoints || 0) > 0;

/* ---------------- Stato ---------------- */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let view = { s: 1, ox: 0, oy: 0, rot: false, vw: 1, vh: 1, dpr: 1, flip: false };

let level, pegs, nozzles, rings, bubbles;
let state = 'start';              // start | play | end
let curLevel = 0, unlocked = 0, timeLeft = TIME_LIMIT, lastSec = 0, winHold = 0, endAnim = 0, result = null;
let toastText = '', toastT = 0, hintOpen = false, pendingFs = 0, pendingAct = null;
let adPlaying = false, continueUsed = false, runOffered = false, rewardBroken = false;
// Progressi: su CrazyGames solo nel loro Data module (obbligatorio), altrove in localStorage.
const SAVE_KEY = 'hooplagoon_save';
const save = { unlocked: 0, level: 0, best: [], passed: [] };
function readSave() {
  let raw = null;
  try { raw = CG.ok ? CG.sdk.data.getItem(SAVE_KEY) : localStorage.getItem(SAVE_KEY); } catch (e) {}
  if (raw) { try { Object.assign(save, JSON.parse(raw)); } catch (e) {} }
  else if (!CG.ok) {                      // porta con s\u00e9 i progressi della versione precedente
    try {
      save.unlocked = parseInt(localStorage.getItem('ninni_unlocked'), 10) || 0;
      for (let i = 0; i < LEVELS.length; i++) { const r = parseInt(localStorage.getItem('ninni_rings_' + i), 10); if (r > 0) save.best[i] = r; }
      for (let i = 0; i < save.unlocked; i++) save.passed[i] = 1;
    } catch (e) {}
  }
  unlocked = Math.max(0, Math.min(LEVELS.length - 1, save.unlocked | 0));
  curLevel = Math.max(0, Math.min(unlocked, save.level | 0));
}
function writeSave() {
  const raw = JSON.stringify(save);
  try { if (CG.ok) CG.sdk.data.setItem(SAVE_KEY, raw); else localStorage.setItem(SAVE_KEY, raw); } catch (e) {}
}
function toast(t, secs) { toastText = t; toastT = secs || 2.5; }
let soundOn = true;
// Movimento del telefono: accX/accY = "gravità efficace" (gravità meno accelerazione del telefono)
// in coordinate di gioco, in unità di g. Senza sensori resta (0, 1) = verso il basso.
let tiltOn = true, haveSensor = false, accX = 0, accY = 1;
let sloshX = 0, sloshY = 0, swirl = 0;      // spinte da applicare all'acqua al prossimo passo
const fishes = [];                          // pesciolini vivi: nuotano e urtano gli anelli
const specks = [];                          // pulviscolo che rende visibile il moto dell'acqua
const pumps = [mkPump(85), mkPump(915)];
// burst = portata attuale del getto (0..1), charge = riserva della pompa, force = quanto forte si preme
function mkPump(cx) { return { cx, cy: 245, r: 54, down: false, press: 0, charge: 1, burst: 0, ids: new Set(), hold: 0, minT: 0, sense: null, force: 0 }; }

const BTN_SOUND = { x: 52, y: 424, r: 24 };
const BTN_TILT = { x: 118, y: 424, r: 24 };
const BTN_RESET = { x: 915, y: 424, r: 24 };
const BTN_FULL = { x: 849, y: 424, r: 24 };

/* ---------------- Fluido (stable fluids) ---------------- */
const SZ = (N + 2) * (M + 2);
let u = new Float32Array(SZ), v = new Float32Array(SZ);
let u0 = new Float32Array(SZ), v0 = new Float32Array(SZ);
const pr = new Float32Array(SZ), dv = new Float32Array(SZ);
const IX = (i, j) => i + (N + 2) * j;

function setBnd(b, x) {
  for (let i = 1; i <= N; i++) {
    x[IX(i, 0)] = b === 2 ? -x[IX(i, 1)] : x[IX(i, 1)];
    x[IX(i, M + 1)] = b === 2 ? -x[IX(i, M)] : x[IX(i, M)];
  }
  for (let j = 1; j <= M; j++) {
    x[IX(0, j)] = b === 1 ? -x[IX(1, j)] : x[IX(1, j)];
    x[IX(N + 1, j)] = b === 1 ? -x[IX(N, j)] : x[IX(N, j)];
  }
  x[IX(0, 0)] = 0.5 * (x[IX(1, 0)] + x[IX(0, 1)]);
  x[IX(0, M + 1)] = 0.5 * (x[IX(1, M + 1)] + x[IX(0, M)]);
  x[IX(N + 1, 0)] = 0.5 * (x[IX(N, 0)] + x[IX(N + 1, 1)]);
  x[IX(N + 1, M + 1)] = 0.5 * (x[IX(N, M + 1)] + x[IX(N + 1, M)]);
}

function project(a, b) {
  const w = N + 2;
  for (let j = 1; j <= M; j++) for (let i = 1; i <= N; i++) {
    const k = i + w * j;
    dv[k] = -0.5 * (a[k + 1] - a[k - 1] + b[k + w] - b[k - w]);
    pr[k] = 0;
  }
  setBnd(0, dv); setBnd(0, pr);
  for (let it = 0; it < 14; it++) {
    for (let j = 1; j <= M; j++) for (let i = 1; i <= N; i++) {
      const k = i + w * j;
      pr[k] = (dv[k] + pr[k - 1] + pr[k + 1] + pr[k - w] + pr[k + w]) * 0.25;
    }
    setBnd(0, pr);
  }
  for (let j = 1; j <= M; j++) for (let i = 1; i <= N; i++) {
    const k = i + w * j;
    a[k] -= 0.5 * (pr[k + 1] - pr[k - 1]);
    b[k] -= 0.5 * (pr[k + w] - pr[k - w]);
  }
  setBnd(1, a); setBnd(2, b);
}

function advect(b, d, d0, a, c) {
  for (let j = 1; j <= M; j++) for (let i = 1; i <= N; i++) {
    const k = IX(i, j);
    let x = i - DT * a[k], y = j - DT * c[k];
    if (x < 0.5) x = 0.5; else if (x > N + 0.5) x = N + 0.5;
    if (y < 0.5) y = 0.5; else if (y > M + 0.5) y = M + 0.5;
    const i0 = x | 0, j0 = y | 0, s1 = x - i0, t1 = y - j0;
    d[k] = (1 - s1) * ((1 - t1) * d0[IX(i0, j0)] + t1 * d0[IX(i0, j0 + 1)]) +
           s1 * ((1 - t1) * d0[IX(i0 + 1, j0)] + t1 * d0[IX(i0 + 1, j0 + 1)]);
  }
  setBnd(b, d);
}

function fluidStep() {
  // getti
  for (let n = 0; n < nozzles.length; n++) {
    const p = pumps[n], nz = nozzles[n];
    if (p.burst < 0.02) continue;
    const ci = nz.gi, cj = M - 1;
    for (let j = cj - 3; j <= M; j++) for (let i = ci - 2; i <= ci + 2; i++) {
      if (i < 1 || i > N) continue;
      const d2 = (i - ci) * (i - ci) + (j - cj) * (j - cj) * 0.5;
      const wgt = Math.exp(-d2 / 3) * 0.6;
      const k = IX(i, j);
      u[k] += (nz.dx * JET * p.burst - u[k]) * wgt;
      v[k] += (-JET * p.burst - v[k]) * wgt;
    }
  }
  if (level.gyre) {                   // in alto verso destra, in basso verso sinistra
    const f = level.gyre * 0.045;
    for (let j = 1; j <= M; j++) { const d = j < M * 0.4 ? f : j > M * 0.6 ? -f : 0; if (d) for (let i = 1; i <= N; i++) u[IX(i, j)] += d; }
  }
  if (sloshX || sloshY || swirl) {
    const ci = (N + 1) / 2, cj = (M + 1) / 2;
    for (let j = 1; j <= M; j++) for (let i = 1; i <= N; i++) {
      const k = IX(i, j);
      u[k] += sloshX - swirl * (j - cj);
      v[k] += sloshY + swirl * (i - ci);
    }
    sloshX = sloshY = swirl = 0;
  }
  project(u, v);
  u0.set(u); v0.set(v);
  advect(1, u, u0, u0, v0);
  advect(2, v, v0, u0, v0);
  project(u, v);
  for (let k = 0; k < SZ; k++) { u[k] *= 0.992; v[k] *= 0.992; }
}

let fx = 0, fy = 0;
function sample(x, y) {             // velocità dell'acqua in px/s
  let gx = (x - TANK.x) / CELL + 0.5, gy = (y - TANK.y) / CELL + 0.5;
  if (gx < 0.5) gx = 0.5; else if (gx > N + 0.5) gx = N + 0.5;
  if (gy < 0.5) gy = 0.5; else if (gy > M + 0.5) gy = M + 0.5;
  const i0 = gx | 0, j0 = gy | 0, s1 = gx - i0, t1 = gy - j0;
  const a = IX(i0, j0), b = IX(i0 + 1, j0), c = IX(i0, j0 + 1), d = IX(i0 + 1, j0 + 1);
  fx = ((1 - s1) * ((1 - t1) * u[a] + t1 * u[c]) + s1 * ((1 - t1) * u[b] + t1 * u[d])) * CELL;
  fy = ((1 - s1) * ((1 - t1) * v[a] + t1 * v[c]) + s1 * ((1 - t1) * v[b] + t1 * v[d])) * CELL;
}

/* ---------------- Fondo sabbioso (fa scivolare gli anelli verso i getti) ---------------- */
function floorY(x) {
  let d = Infinity;
  for (const nz of nozzles) d = Math.min(d, Math.abs(x - nz.px));
  const t = Math.min(1, d / 190);
  return TB - 4 - 24 * t * t * (3 - 2 * t);
}

/* ---------------- Setup livello ---------------- */
function loadLevel(idx) {
  level = LEVELS[idx];
  pegs = level.pegs.map(p => ({
    x: TANK.x + p.x * TANK.w, tipY: TANK.y + p.tip * TANK.h, baseY: TANK.y + p.base * TANK.h, count: 0,
  }));
  nozzles = NOZZLES.map(n => {
    const gi = Math.round(n.x * N);
    return { gi, px: TANK.x + (gi - 0.5) * CELL, dx: n.dx };
  });
  u.fill(0); v.fill(0);
  rings = [];
  for (let i = 0; i < level.rings; i++) {
    const x = TANK.x + 40 + Math.random() * (TANK.w - 80);
    rings.push({
      x, y: floorY(x) - R - Math.random() * 60, vx: 0, vy: 0, px: x, py: 0,
      rot: Math.random() * 6.28, spin: (Math.random() - 0.5) * 2, phase: Math.random() * 6.28,
      color: COLORS[i % COLORS.length], peg: -1, z: i & 1, pop: 0,
    });
  }
  bubbles = [];
  fishes.length = 0;
  const FC = ['#ffb347', '#ff7a8a', '#ffe680', '#7df0c8', '#ff9ad5'];
  const nf = level.fish;
  for (let i = 0; i < nf; i++) {
    const dir = i % 2 ? -1 : 1, size = 0.75 + Math.random() * 0.5;
    const hy = TANK.y + 45 + (nf > 1 ? i / (nf - 1) : 0.5) * (TANK.h - 130);
    fishes.push({
      x: TANK.x + 60 + Math.random() * (TANK.w - 120), y: hy + Math.random() * 20,
      vx: dir * 30, vy: 0, dir, face: dir, size, color: FC[i % FC.length], speed: (26 + Math.random() * 22) * level.fishSpeed,
      homeY: hy, wag: Math.random() * 6, scare: 0, hit: 0, turnT: 3 + Math.random() * 6,
    });
  }
  specks.length = 0;
  for (let i = 0; i < 46; i++) specks.push({ x: TANK.x + Math.random() * TANK.w, y: TANK.y + Math.random() * TANK.h, w: 4 + Math.random() * 10, r: 0.8 + Math.random() * 1.2 });
  timeLeft = TIME_LIMIT; lastSec = TIME_LIMIT; winHold = 0; endAnim = 0; result = null;
  for (const p of pumps) { p.burst = 0; p.charge = 1; p.minT = 0; p.down = false; p.ids.clear(); }
  drawBackdrop();
}
function startLevel(idx) {
  curLevel = idx; save.level = idx; writeSave();
  loadLevel(idx);
  state = 'play'; continueUsed = false; runOffered = false;
  gameplay(true);
  toast(t('goalToast', levelName(idx), level.min), 3);
}
// tempo extra dopo un video premio: si continua lo stesso livello
function continueLevel() {
  continueUsed = true; result = null; endAnim = 0; winHold = 0;
  timeLeft = 30; lastSec = 30; state = 'play';
  gameplay(true);
  toast(t('bonus'), 2);
}
function recordOf(idx) { return save.best[idx] | 0; }

/* ---------------- Fisica anelli ---------------- */
function physicsStep() {
  for (const p of pumps) {
    let target = 0;
    if (p.down || p.minT > 0) {          // un tocco breve dà comunque uno sbuffo minimo
      p.minT -= DT;
      p.hold += DT;
      // forza: sensore di pressione/area del dito se c'è, altrimenti cresce tenendo premuto
      const ramp = 0.42 + 0.38 * Math.min(1, p.hold / 0.45);
      p.force = p.sense === null ? Math.min(1, ramp + 0.2 * Math.min(1, p.hold / 0.9)) : Math.max(ramp, 0.25 + 0.75 * p.sense);
      if (state === 'play' && p.charge > 0) {
        target = p.force;
        p.charge = Math.max(0, p.charge - DT * (0.35 + 0.75 * p.force) / PUMP_STROKE);
      }
    } else {
      p.force = 0;
      p.charge = Math.min(1, p.charge + DT / PUMP_REFILL);
    }
    p.press += ((p.down ? 0.35 + 0.65 * p.force : 0) - p.press) * 0.4;
    p.burst += (target - p.burst) * (target > p.burst ? 0.3 : 0.12);
  }
  fluidStep();

  // bolle
  for (let n = 0; n < nozzles.length; n++) {
    const b = pumps[n].burst;
    if (b > 0.12 && bubbles.length < 160) {
      for (let k = 0; k < 1 + b * 2; k++) bubbles.push({
        x: nozzles[n].px + (Math.random() - 0.5) * 22, y: TB - 8 - Math.random() * 14,
        r: 1.5 + Math.random() * 3.5, life: 1 + Math.random() * 1.6,
      });
    }
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    sample(b.x, b.y);
    b.x += (fx + Math.sin(b.life * 9 + i) * 14) * DT;
    b.y += (fy - 45 - b.r * 8) * DT;
    b.life -= DT;
    if (b.life <= 0 || b.y < TANK.y + 4) bubbles.splice(i, 1);
  }

  for (const sp of specks) {
    sample(sp.x, sp.y);
    sp.x += fx * DT + accX * sp.w * DT; sp.y += fy * DT + accY * sp.w * DT;
    if (sp.x < TANK.x + 3) sp.x = TANK.x + 3; else if (sp.x > TANK.x + TANK.w - 3) sp.x = TANK.x + TANK.w - 3;
    if (sp.y < TANK.y + 3) sp.y = TANK.y + 3;
    else if (sp.y > TB - 6) { sp.y = TB - 6; if (Math.random() < 0.004) sp.y = TANK.y + 10 + Math.random() * 60; }
  }
  updateMotion();
  updateFishes();

  const L = TANK.x + R, Rr = TANK.x + TANK.w - R, T = TANK.y + R;
  for (const r of rings) {
    sample(r.x, r.y);
    r.px = r.x; r.py = r.y;
    if (r.pop > 0) r.pop -= DT * 3;
    if (r.peg >= 0) {
      const p = pegs[r.peg];
      r.vy += (fy - r.vy) * DRAG * 0.55 * DT + G * accY * DT;
      r.y += r.vy * DT;
      r.x += (p.x - r.x) * 0.3; r.vx = 0;
      if (r.y < p.tipY - 3) {           // un getto forte può sfilarlo!
        r.peg = -1; r.vx = fx * 0.5; r.z = 1;
      }
      continue;
    }
    r.vx += (fx - r.vx) * DRAG * DT + G * accX * DT;
    r.vy += (fy - r.vy) * DRAG * DT + G * accY * DT;
    r.x += r.vx * DT; r.y += r.vy * DT;
    const sp = Math.hypot(r.vx, r.vy);
    r.phase += (0.4 + sp * 0.02) * DT * (r.spin > 0 ? 1 : -1);
    r.rot += r.spin * (0.15 + sp * 0.006) * DT;

    if (r.x < L) { r.x = L; r.vx = Math.abs(r.vx) * 0.3; }
    if (r.x > Rr) { r.x = Rr; r.vx = -Math.abs(r.vx) * 0.3; }
    if (r.y < T) { r.y = T; r.vy = Math.abs(r.vy) * 0.3; }
    const fl = floorY(r.x) - R * 0.8;
    if (r.y > fl) {
      r.y = fl;
      if (r.vy > 0) r.vy = 0;
      const slope = (floorY(r.x + 2) - floorY(r.x - 2)) / 4;
      r.vx += slope * G * 1.2 * Math.max(0, accY) * DT;
      r.vx *= 0.97;
    }

    // infilato? il centro dell'anello scende sopra la punta
    if (r.vy > 0) {
      for (let k = 0; k < pegs.length; k++) {
        const p = pegs[k], cy = p.tipY + 7;
        // piccolo "imbuto": vicino alla punta l'anello tende a centrarsi
        if (r.y > cy - 50 && r.y <= cy && Math.abs(r.x - p.x) < 34) r.vx += (p.x - r.x) * FUNNEL * DT;
        if (r.py <= cy && r.y > cy && Math.abs(r.x - p.x) < 14) {
          r.peg = k; r.vx = 0; r.vy *= 0.5; r.pop = 1;
          sfxCatch(p.count);
          break;
        }
      }
    }
  }

  // urti morbidi fra anelli liberi
  const D = R * 1.5;
  for (let i = 0; i < rings.length; i++) {
    const a = rings[i]; if (a.peg >= 0) continue;
    for (let j = i + 1; j < rings.length; j++) {
      const b = rings[j]; if (b.peg >= 0) continue;
      const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
      if (d2 < D * D && d2 > 0.01) {
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, o = (D - d) * 0.25;
        a.x -= nx * o; a.y -= ny * o; b.x += nx * o; b.y += ny * o;
        const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rv < 0) { const imp = rv * 0.5; a.vx += nx * imp; a.vy += ny * imp; b.vx -= nx * imp; b.vy -= ny * imp; }
      }
    }
  }

  // pile sui pioli
  let done = 0;
  for (let k = 0; k < pegs.length; k++) {
    const p = pegs[k];
    const st = rings.filter(r => r.peg === k).sort((a, b) => b.y - a.y);
    p.count = st.length; done += st.length;
    let lim = p.baseY - 8;
    for (const r of st) {
      if (r.y > lim) { r.y = lim; if (r.vy > 0) r.vy = 0; }
      lim = r.y - 8;
    }
  }

  if (toastT > 0) toastT -= DT;
  if (state === 'play' && !PROMO) {
    timeLeft -= DT;
    const sec = Math.ceil(timeLeft);
    if (sec !== lastSec) { lastSec = sec; if (sec <= 10 && sec > 0) sfxTick(sec); }
    if (done === rings.length) { winHold += DT; if (winHold > 0.7) endLevel(); } else winHold = 0;
    if (timeLeft <= 0) { timeLeft = 0; endLevel(); }
  }
  if (state === 'end') endAnim += DT;
}

/* ---------------- Pesciolini ---------------- */
function updateFishes() {
  const L = TANK.x + 26, Rr = TANK.x + TANK.w - 26, T = TANK.y + 22, B = TB - 46;
  for (const f of fishes) {
    const rf = 13 * f.size, mass = 2.2 * f.size;
    // nuoto: velocità di crociera nella direzione scelta, più svelto se spaventato
    f.turnT -= DT;
    if (f.turnT <= 0) { f.turnT = 4 + Math.random() * 7; if (Math.random() < 0.5) f.dir = -f.dir; f.homeY = T + 20 + Math.random() * (B - T - 40); }
    if (f.x < L + 20) f.dir = 1; else if (f.x > Rr - 20) f.dir = -1;
    const sp = f.speed * (1 + f.scare * 3.5);
    const steer = f.hit > 0 ? 0.6 : 2.2;                 // appena urtato resta "stordito" e si lascia portare
    f.vx += (f.dir * sp - f.vx) * steer * DT;
    f.vy += ((f.homeY - f.y) * 0.6 + Math.sin(f.wag * 0.35) * 8 - f.vy) * steer * DT;
    // la corrente lo trascina
    sample(f.x, f.y);
    f.vx += (fx - f.vx) * 1.6 * DT; f.vy += (fy - f.vy) * 1.6 * DT;
    f.x += f.vx * DT; f.y += f.vy * DT;
    if (f.x < L) { f.x = L; f.vx = Math.abs(f.vx) * 0.5; f.dir = 1; }
    if (f.x > Rr) { f.x = Rr; f.vx = -Math.abs(f.vx) * 0.5; f.dir = -1; }
    if (f.y < T) { f.y = T; f.vy = Math.abs(f.vy) * 0.5; }
    if (f.y > B) { f.y = B; f.vy = -Math.abs(f.vy) * 0.5; }
    const v = Math.hypot(f.vx, f.vy);
    f.wag += (4 + v * 0.16) * DT;
    if (Math.abs(f.vx) > 8) f.face += (Math.sign(f.vx) - f.face) * 0.15;
    if (f.scare > 0) f.scare = Math.max(0, f.scare - DT * 1.1);
    if (f.hit > 0) f.hit = Math.max(0, f.hit - DT * 2.5);

    // urti con gli anelli
    for (const r of rings) {
      const dx = r.x - f.x, dy = r.y - f.y, D = rf + R * 0.85, d2 = dx * dx + dy * dy;
      if (d2 >= D * D || d2 < 0.01) continue;
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, over = D - d;
      const fixed = r.peg >= 0;                           // anello sul razzo: non si sposta di lato
      const rvx = (fixed ? 0 : r.vx) - f.vx, rvy = r.vy - f.vy, rv = rvx * nx + rvy * ny;
      if (fixed) { f.x -= nx * over; f.y -= ny * over; }
      else { const k = mass / (mass + 1); r.x += nx * over * k; r.y += ny * over * k; f.x -= nx * over * (1 - k); f.y -= ny * over * (1 - k); }
      if (rv < 0) {                                       // si stanno venendo incontro: scambio di quantità di moto
        const e = 0.55, j = -(1 + e) * rv / (fixed ? 1 / mass : 1 / mass + 1);
        f.vx -= j / mass * nx; f.vy -= j / mass * ny;
        if (fixed) r.vy += j * ny * 0.6;
        else { r.vx += j * nx; r.vy += j * ny; r.spin = (Math.random() - 0.5) * 6; }
        const force = -rv;
        if (force > 35) {
          f.hit = 1; f.scare = Math.min(1, 0.4 + force / 300);
          f.dir = nx > 0 ? -1 : 1;                        // scappa dalla parte opposta
          f.homeY = Math.max(T + 10, Math.min(B - 10, f.y - ny * 70));
          f.turnT = 2 + Math.random() * 3;
          if (bubbles.length < 150) for (let b = 0; b < 3; b++) bubbles.push({ x: f.x + nx * rf, y: f.y + ny * rf, r: 1 + Math.random() * 2, life: 0.5 + Math.random() * 0.6 });
          sfxBump(force);
        }
      }
    }
  }
  // i pesci non si attraversano fra loro
  for (let i = 0; i < fishes.length; i++) for (let j = i + 1; j < fishes.length; j++) {
    const a = fishes[i], b = fishes[j], dx = b.x - a.x, dy = b.y - a.y, D = 13 * (a.size + b.size), d2 = dx * dx + dy * dy;
    if (d2 < D * D && d2 > 0.01) {
      const d = Math.sqrt(d2), o = (D - d) * 0.5, nx = dx / d, ny = dy / d;
      a.x -= nx * o; a.y -= ny * o; b.x += nx * o; b.y += ny * o;
      a.vy -= ny * 20; b.vy += ny * 20;
    }
  }
}

function drawFish(f) {
  ctx.save();
  ctx.translate(f.x, f.y);
  const tilt = Math.max(-0.5, Math.min(0.5, f.vy * 0.006)) + f.hit * Math.sin(f.wag * 6) * 0.25;
  ctx.scale((f.face >= 0 ? 1 : -1) * Math.max(0.25, Math.abs(f.face)) * f.size, f.size);
  ctx.rotate(tilt);
  const sq = 1 + f.hit * 0.18;                            // si schiaccia un attimo all'urto
  ctx.scale(1 / sq, sq);
  const w = Math.sin(f.wag) * 5;
  ctx.fillStyle = f.color;
  ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(-26, -9 + w); ctx.lineTo(-22, w * 0.6); ctx.lineTo(-26, 9 + w); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 0, 16, 8.5, 0, 0, 6.3); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-4, -7); ctx.lineTo(2, -14); ctx.lineTo(7, -7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.ellipse(1, 3, 10, 3.5, 0, 0, 6.3); ctx.fill();
  const eye = 2.6 + f.scare * 1.6;                        // occhio sgranato quando è spaventato
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(8, -2, eye, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#123'; ctx.beginPath(); ctx.arc(8.7, -2, 1.2, 0, 6.3); ctx.fill();
  ctx.restore();
}

function ringsDone() { let n = 0; for (const r of rings) if (r.peg >= 0) n++; return n; }

function endLevel() {
  const done = ringsDone(), all = rings.length, passed = done >= level.min;
  const stars = !passed ? 0 : done === all ? 3 : done >= Math.ceil((level.min + all) / 2) ? 2 : 1;
  const record = done > recordOf(curLevel);
  if (record) save.best[curLevel] = done;
  const last = curLevel === LEVELS.length - 1;
  if (passed) save.passed[curLevel] = 1;
  if (passed && !last && curLevel + 1 > unlocked) { unlocked = curLevel + 1; save.unlocked = unlocked; }
  writeSave();
  if (passed) reportProgress();
  // video premio "+30 s": solo se manca poco, una volta per partita, mai dopo un midgame nello stesso passaggio
  const offer = !passed && adsReady() && !continueUsed && !rewardBroken && done >= Math.max(1, level.min - 3);
  if (offer) runOffered = true;
  result = { done, all, passed, stars, record, last, offer, used: TIME_LIMIT - timeLeft + (continueUsed ? 30 : 0) };
  state = 'end'; endAnim = 0;
  gameplay(false);
  for (const p of pumps) { p.down = false; p.ids.clear(); }
  if (passed) sfxWin(); else sfxFail();
}
// pulsanti della schermata di fine livello (usati sia per disegnare sia per il tocco)
function endButtons() {
  if (!result) return [];
  const y = 334, h = 58;
  // un'offerta video e un midgame non possono stare nello stesso passaggio fra due livelli
  const go = idx => () => (runOffered ? startLevel(idx) : withMidgame(() => startLevel(idx)));
  const retry = { label: t('retry'), act: go(curLevel) };
  if (!result.passed) {
    if (result.offer && !rewardBroken) return [{ ...retry, x: W / 2 - 270, y, w: 250, h, main: true },
      { label: t('video'), act: showRewarded, x: W / 2 + 20, y, w: 250, h, video: true }];
    return [{ ...retry, x: W / 2 - 130, y, w: 260, h, main: true }];
  }
  const next = result.last ? { label: t('fromStart'), act: go(0) } : { label: t('next'), act: go(curLevel + 1) };
  return [{ ...retry, x: W / 2 - 270, y, w: 250, h }, { ...next, x: W / 2 + 20, y, w: 250, h, main: true }];
}

/* ---------------- Portali: CrazyGames e GameDistribution ---------------- */
// Il gioco chiama solo le funzioni qui sotto; ognuna sa cosa fare sul portale in cui gira.
// Fuori dai portali (GitHub Pages, itch.io) non c'\u00e8 pubblicit\u00e0 e il gioco funziona da solo.
const CG = { ok: false, sdk: null, env: 'none', adblock: false, mute: false, device: null };
const GD = { ok: false, paused: false, rewarded: false };
let PLAT = 'none';                      // portale effettivamente attivo
async function initPlatform() {
  if (PLATFORM === 'gamedistribution') { await initGD(); return; }
  if (PLATFORM === 'none') return;
  try {
    const S = window.CrazyGames && window.CrazyGames.SDK;
    if (!S) return;
    // se l'SDK non risponde (sito non CrazyGames, rete lenta) il gioco parte lo stesso
    const ready = await Promise.race([S.init().then(() => true), new Promise(r => setTimeout(() => r(false), 5000))]);
    if (!ready) return;
    CG.env = S.environment;
    if (CG.env !== 'crazygames' && CG.env !== 'local') return;
    CG.sdk = S; CG.ok = true; PLAT = 'crazygames';
    try { S.game.loadingStart(); } catch (e) {}
    try { const si = S.user.systemInfo; if (si) { if (si.locale) setLang(si.locale); if (si.device) CG.device = si.device.type; } } catch (e) {}
    try { CG.mute = !!S.game.settings.muteAudio; S.game.addSettingsChangeListener(st => { CG.mute = !!st.muteAudio; }); } catch (e) {}
    try { CG.adblock = await S.ad.hasAdblock(); } catch (e) {}
    try { S.game.loadingStop(); } catch (e) {}
  } catch (e) { CG.ok = false; PLAT = 'none'; }
}
// GameDistribution: SDK caricato una sola volta all'avvio; pausa e muto li comanda lui con gli eventi
function initGD() {
  return new Promise(resolve => {
    let settled = false;
    const fin = () => { if (!settled) { settled = true; resolve(); } };
    if (!GD_GAME_ID) { fin(); return; }
    window.GD_OPTIONS = {
      gameId: GD_GAME_ID,
      onEvent: ev => {
        switch (ev.name) {
          case 'SDK_READY': GD.ok = true; PLAT = 'gamedistribution'; fin(); break;
          case 'SDK_ERROR': fin(); break;
          case 'SDK_GAME_PAUSE': GD.paused = true; adAudio(true); break;
          case 'SDK_GAME_START': GD.paused = false; adAudio(false); break;
          case 'SDK_REWARDED_WATCH_COMPLETE': GD.rewarded = true; break;
        }
      },
    };
    const js = document.createElement('script');
    js.id = 'gamedistribution-jssdk'; js.src = 'https://html5.api.gamedistribution.com/main.min.js';
    js.onerror = fin; document.head.appendChild(js);
    setTimeout(fin, 5000);
  });
}
let gpOn = false;
function gameplay(on) {
  if (PLAT !== 'crazygames' || gpOn === on) return;
  gpOn = on;
  try { if (on) CG.sdk.game.gameplayStart(); else CG.sdk.game.gameplayStop(); } catch (e) {}
}
function reportProgress() {
  if (PLAT !== 'crazygames') return;
  let n = 0; for (let i = 0; i < LEVELS.length; i++) if (save.passed[i]) n++;
  try { CG.sdk.game.reportGameCompletedPercentage(Math.round(n / LEVELS.length * 100)); } catch (e) {}
}
function adsReady() {
  if (PLAT === 'crazygames') return !CG.adblock;
  if (PLAT === 'gamedistribution') return GD.ok && !!window.gdsdk;
  return false;
}
function adAudio(off) {                 // il gioco deve tacere durante il video
  if (!ac) return;
  try { if (off) ac.suspend(); else ac.resume(); } catch (e) {}
}
function paused() { return adPlaying || GD.paused; }
// pubblicit\u00e0 fra un livello e l'altro (la frequenza la decide il portale)
function withMidgame(next) {
  if (!adsReady()) { next(); return; }
  adPlaying = true;
  const done = () => { if (!adPlaying) return; adPlaying = false; adAudio(false); next(); };
  try {
    if (PLAT === 'gamedistribution') Promise.resolve(window.gdsdk.showAd()).then(done, done);
    else CG.sdk.ad.requestAd('midgame', { adStarted: () => adAudio(true), adFinished: done, adError: done });
  } catch (e) { done(); }
}
// video facoltativo che regala 30 secondi
function showRewarded() {
  if (!adsReady() || adPlaying) return;
  adPlaying = true;
  let settled = false;
  const finish = ok => {
    if (settled) return; settled = true; adPlaying = false; adAudio(false);
    if (ok) continueLevel(); else { rewardBroken = true; toast(t('adFail'), 2.5); }
  };
  try {
    if (PLAT === 'gamedistribution') {
      GD.rewarded = false;           // il premio vale solo se arriva SDK_REWARDED_WATCH_COMPLETE
      window.gdsdk.showAd('rewarded').then(() => finish(GD.rewarded), () => finish(false));
    } else {
      CG.sdk.ad.requestAd('rewarded', { adStarted: () => adAudio(true), adFinished: () => finish(true), adError: () => finish(false) });
    }
  } catch (e) { finish(false); }
}
// dal menu iniziale: su GameDistribution \u00e8 richiesta una pubblicit\u00e0 prima di giocare
function startFromMenu() {
  if (PLAT === 'gamedistribution') withMidgame(() => startLevel(curLevel)); else startLevel(curLevel);
}
function isMobile() { return CG.device ? CG.device !== 'desktop' : TOUCH; }
// su CrazyGames lo schermo intero lo d\u00e0 il sito (vietato il nostro pulsante); dentro altri siti
// lo mostriamo solo dove il browser lo permette davvero
function fsAllowed() {
  if (PLATFORM === 'crazygames' || PLAT === 'crazygames') return false;
  return PLATFORM === 'auto' || canFullscreen();
}

/* ---------------- Input ---------------- */
function toLogical(e) {
  const sx = e.clientX, sy = e.clientY;
  if (view.rot && view.flip) return { x: (view.vh - view.ox - sy) / view.s, y: (sx - view.oy) / view.s };
  if (view.rot) return { x: (sy - view.ox) / view.s, y: (view.vw - view.oy - sx) / view.s };
  return { x: (sx - view.ox) / view.s, y: (sy - view.oy) / view.s };
}
const hit = (b, p) => Math.hypot(p.x - b.x, p.y - b.y) < b.r + 8;

// Stima della forza del dito (0..1): pressione reale se il telefono la fornisce,
// altrimenti l'area di contatto (premendo forte il polpastrello si allarga).
let areaMin = Infinity, areaMax = 0;
function senseOf(e) {
  if (!e || e.pointerType === 'mouse') return null;
  const pr = e.pressure;
  if (pr > 0 && pr !== 0.5 && pr !== 1) return Math.min(1, pr * 1.5);
  const a = Math.max(e.width || 0, e.height || 0);
  if (a > 1.5) {
    areaMin = Math.min(areaMin, a); areaMax = Math.max(areaMax, a);
    if (areaMax - areaMin > 8) return Math.min(1, (a - areaMin) / (areaMax - areaMin));
  }
  return null;
}
function pumpDown(i, id, e) {
  const p = pumps[i];
  p.ids.add(id);
  p.sense = senseOf(e);
  if (p.down) return;
  p.down = true; p.hold = 0; p.minT = 0.17;
  if (state !== 'play') return;
  sfxPump(0.4 + 0.6 * p.charge);
}
function pumpMove(id, e) {
  for (const p of pumps) if (p.ids.has(id)) { const sn = senseOf(e); if (sn !== null) p.sense = p.sense === null ? sn : Math.max(sn, p.sense * 0.9); }
}
function pumpUp(id) {
  for (const p of pumps) if (p.ids.delete(id) && p.ids.size === 0) p.down = false;
}

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (paused()) return;
  initAudio();
  const p = toLogical(e);
  if (hintOpen) { hintOpen = false; return; }
  if (state === 'start') { if (fsAllowed() && canFullscreen() && !fsElement()) pendingFs = 1; pendingAct = startFromMenu; return; }
  if (fsAllowed() && hit(BTN_FULL, p)) { pendingFs = 2; if (!canFullscreen()) toggleFullscreen(false); return; }
  if (state === 'end') {
    if (endAnim > 0.8) for (const b of endButtons()) if (p.x > b.x && p.x < b.x + b.w && p.y > b.y && p.y < b.y + b.h) { pendingAct = b.act; break; }
    return;
  }
  if (hit(BTN_SOUND, p)) { soundOn = !soundOn; return; }
  if (hit(BTN_TILT, p)) { toggleTilt(); return; }
  if (hit(BTN_RESET, p)) { startLevel(curLevel); return; }
  pumpDown(p.x < W / 2 ? 0 : 1, e.pointerId, e);
}, { passive: false });
cv.addEventListener('pointermove', e => pumpMove(e.pointerId, e));
for (const ev of ['pointerup', 'pointercancel'])
  cv.addEventListener(ev, e => pumpUp(e.pointerId));
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

const KEYS = { ArrowLeft: 0, KeyA: 0, ArrowRight: 1, KeyD: 1, KeyL: 1 };   // per posizione del tasto: va bene anche su AZERTY
addEventListener('keydown', e => {
  if (e.code in KEYS || e.code === 'Space') e.preventDefault();
  if (e.repeat || paused()) return;
  initAudio();
  if (hintOpen) { hintOpen = false; return; }
  if (state === 'start') { pendingAct = startFromMenu; return; }
  if (state === 'end') { if (endAnim > 0.8 && (e.key === 'Enter' || e.key === ' ')) { const m = endButtons().find(b => b.main); if (m) pendingAct = m.act; } return; }
  if (e.code in KEYS) pumpDown(KEYS[e.code], 'k' + e.code);
  if (e.code === 'KeyR') startLevel(curLevel);
  if (e.code === 'KeyF' && fsAllowed()) toggleFullscreen(false);
});
addEventListener('keyup', e => { if (e.code in KEYS) pumpUp('k' + e.code); });

/* ---------------- Schermo intero ---------------- */
function fsElement() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
function canFullscreen() { const el = document.documentElement; return !!(el.requestFullscreen || el.webkitRequestFullscreen); }
function isStandalone() {
  try { return navigator.standalone === true || matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches; } catch (e) { return false; }

  ctx.fillStyle = hurry ? '#c8102e' : '#fff'; ctx.font = '900 34px system-ui, sans-serif';
  ctx.fillText(fmt(tl), 0, 0); ctx.restore();
  const rec = recordOf(curLevel);
  if (rec > 0) {
    ctx.fillStyle = 'rgba(6,50,60,0.75)'; ctx.font = '700 13px system-ui, sans-serif';
    ctx.fillText(t('best', rec), 923, 122, 140);
  }

  drawPump(pumps[0], 0); drawPump(pumps[1], 1);

  // pulsantini
  smallBtn(BTN_SOUND, !soundOn); smallBtn(BTN_TILT, tiltOn && haveSensor); smallBtn(BTN_RESET, false); if (fsAllowed()) smallBtn(BTN_FULL, !!fsElement());
  ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // audio
  let b = BTN_SOUND;
  ctx.beginPath(); ctx.moveTo(b.x - 10, b.y - 4); ctx.lineTo(b.x - 4, b.y - 4); ctx.lineTo(b.x + 3, b.y - 10);
  ctx.lineTo(b.x + 3, b.y + 10); ctx.lineTo(b.x - 4, b.y + 4); ctx.lineTo(b.x - 10, b.y + 4); ctx.closePath(); ctx.fill();
  if (soundOn) { ctx.beginPath(); ctx.arc(b.x + 4, b.y, 8, -0.8, 0.8); ctx.stroke(); }
  else { ctx.beginPath(); ctx.moveTo(b.x + 7, b.y - 5); ctx.lineTo(b.x + 13, b.y + 5); ctx.moveTo(b.x + 13, b.y - 5); ctx.lineTo(b.x + 7, b.y + 5); ctx.stroke(); }
  // inclinazione (telefonino inclinato)
  b = BTN_TILT;
  ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(tiltOn && haveSensor ? -0.5 + Math.sin(performance.now() / 300) * 0.2 : -0.5);
  rr(ctx, -6, -11, 12, 22, 3); ctx.stroke(); ctx.restore();
  // schermo intero: quattro angoli (verso fuori per entrare, verso dentro per uscire)
  b = BTN_FULL;
  if (fsAllowed()) { const o = fsElement() ? -1 : 1;
    for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      const cx = b.x + sx * 8, cy = b.y + sy * 8;
      ctx.beginPath(); ctx.moveTo(cx - sx * 6 * o, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy - sy * 6 * o); ctx.stroke();
    } }
  // ricomincia
  b = BTN_RESET;
  ctx.beginPath(); ctx.arc(b.x, b.y, 9, -0.3, Math.PI * 1.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(b.x + 3, b.y - 14); ctx.lineTo(b.x + 10, b.y - 8); ctx.lineTo(b.x + 1, b.y - 5); ctx.closePath(); ctx.fill();

  if (toastT > 0 && toastText) {
    const a = Math.min(1, toastT * 3);
    ctx.save(); ctx.globalAlpha = a; ctx.font = '800 17px system-ui, sans-serif'; ctx.textAlign = 'center';
    const tw = Math.min(TANK.w - 20, ctx.measureText(toastText).width + 36);
    ctx.fillStyle = 'rgba(6,20,50,0.82)'; rr(ctx, W / 2 - tw / 2, TANK.y + 12, tw, 36, 18); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(toastText, W / 2, TANK.y + 36, TANK.w - 40);
    ctx.restore();
  }

  if (state === 'start') overlay(() => {
    ctx.fillStyle = '#fff'; ctx.font = 'italic 900 64px "Arial Black", Impact, system-ui, sans-serif';
    ctx.fillText(GAME_NAME.toUpperCase(), W / 2, 160, W - 120);
    ctx.font = '700 21px system-ui, sans-serif'; ctx.fillStyle = '#d8f4ff';
    ctx.fillText(t('tag1'), W / 2, 214, W - 100);
    ctx.fillText(t(isMobile() ? 'tagMobile' : 'tagDesk', LEVELS[curLevel].min), W / 2, 242, W - 100);
    ctx.font = '800 17px system-ui, sans-serif'; ctx.fillStyle = '#ffd23f';
    ctx.fillText(levelName(curLevel).toUpperCase(), W / 2, 280);
    const pulse = 1 + Math.sin(performance.now() / 260) * 0.04;
    ctx.save(); ctx.translate(W / 2, 335); ctx.scale(pulse, pulse);
    ctx.fillStyle = '#ff6b5e'; rr(ctx, -120, -30, 240, 60, 30); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '900 26px system-ui, sans-serif'; ctx.fillText(t('play'), 0, 9);
    ctx.restore();
  });

  if (state === 'end' && result) overlay(() => {
    const k = Math.min(1, endAnim / 0.5), R0 = result;
    ctx.save(); ctx.translate(W / 2, 0); ctx.scale(k, k); ctx.translate(-W / 2, 0);
    const title = t(!R0.passed ? 'timeUp' : R0.done === R0.all ? 'perfect' : R0.last ? 'allDone' : 'cleared');
    ctx.fillStyle = '#fff'; ctx.font = 'italic 900 56px "Arial Black", Impact, system-ui, sans-serif';
    ctx.fillText(title, W / 2, 130, W - 120);
    if (R0.passed) for (let i = 0; i < 3; i++) star(W / 2 + (i - 1) * 78, 192 - (i === 1 ? 10 : 0), 30, i < R0.stars ? '#ffd23f' : 'rgba(255,255,255,0.2)');
    ctx.fillStyle = '#d8f4ff'; ctx.font = '700 24px system-ui, sans-serif';
    ctx.fillText(t('landed', R0.done, R0.all) + (R0.record ? '   \u00b7   ' + t('newBest') : ''), W / 2, R0.passed ? 262 : 210, W - 100);
    ctx.font = '700 19px system-ui, sans-serif';
    if (!R0.passed) ctx.fillText(t('needed', level.min), W / 2, 250, W - 100);
    else if (R0.done === R0.all) ctx.fillText(t('allIn', fmt(R0.used)), W / 2, 294);
    else if (R0.last) ctx.fillText(t('everyLevel'), W / 2, 294);
    for (const b of endButtons()) {
      ctx.fillStyle = b.main ? '#ff6b5e' : b.video ? '#2a9d8f' : 'rgba(255,255,255,0.16)'; rr(ctx, b.x, b.y, b.w, b.h, b.h / 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '900 23px system-ui, sans-serif'; ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 8, b.w - 24);
    }
    ctx.restore();
  });

  if (hintOpen) overlay(() => {
    ctx.fillStyle = '#fff'; ctx.font = '900 34px system-ui, sans-serif';
    ctx.fillText(t('hintTitle'), W / 2, 120);
    ctx.font = '700 22px system-ui, sans-serif'; ctx.fillStyle = '#d8f4ff';
    ctx.fillText(t('hint1'), W / 2, 185, W - 100);
    ctx.fillText(t('hint2'), W / 2, 225, W - 100);
    ctx.fillText(t('hint3'), W / 2, 265, W - 100);
    ctx.font = '700 17px system-ui, sans-serif'; ctx.fillStyle = 'rgba(216,244,255,0.7)';
    ctx.fillText(t('hintClose'), W / 2, 340);
  });
}
function overlay(fn) {
  ctx.fillStyle = 'rgba(6,20,50,0.72)'; rr(ctx, 2, 2, W - 4, H - 4, 58); ctx.fill();
  ctx.textAlign = 'center'; fn();
}

/* ---------------- Vetrina (copertine e video) ---------------- */
let promoAlpha = 1, promoFrame = 0;
function promoTitle() {
  if (promoAlpha <= 0) return;
  const cw = cv.width, ch = cv.height, tall = ch > cw * 0.8;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.save(); ctx.globalAlpha = promoAlpha; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  const lines = tall ? ['HOOP', 'LAGOON'] : ['HOOP LAGOON'];
  const size = tall ? Math.min(cw * 0.2, ch * 0.13) : Math.min(cw * 0.1, ch * 0.16);
  ctx.font = 'italic 900 ' + size + 'px "Arial Black", Impact, system-ui, sans-serif';
  let y = ch * 0.15 + size * 0.85;     // sotto la zona etichette di CrazyGames (angolo in alto a sinistra)
  for (const ln of lines) {
    ctx.shadowColor = 'rgba(0,20,60,0.45)'; ctx.shadowBlur = size * 0.25; ctx.shadowOffsetY = size * 0.06;
    ctx.lineWidth = size * 0.16; ctx.strokeStyle = '#0b3d7a'; ctx.strokeText(ln, cw / 2, y);
    ctx.shadowColor = 'transparent';
    const gr = ctx.createLinearGradient(0, y - size * 0.8, 0, y);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#bdf3ff');
    ctx.fillStyle = gr; ctx.fillText(ln, cw / 2, y);
    y += size * 1.02;
  }
  ctx.restore();
}
function promoStep() {               // pompe automatiche, come un giocatore
  const f = promoFrame++;
  if (f % 50 === 0) pumpDown(0, 'p0'); if (f % 50 === 25) pumpUp('p0');
  if (f % 60 === 7) pumpDown(1, 'p1'); if (f % 60 === 37) pumpUp('p1');
  physicsStep();
}
window.__promo = {
  prepare(seated) {
    loadLevel(0); state = 'play'; promoFrame = 0; promoAlpha = 1;
    const st = seated || [0, 0];
    let k = 0;
    for (let pg = 0; pg < pegs.length; pg++) for (let i = 0; i < st[pg]; i++, k++) { const r = rings[k]; r.peg = pg; r.x = pegs[pg].x; r.y = pegs[pg].tipY + 20; }
    resize();
  },
  run(n) { for (let i = 0; i < n; i++) promoStep(); },
  frame(n, alpha) { for (let i = 0; i < n; i++) promoStep(); if (alpha !== undefined) promoAlpha = alpha; draw(); },
  shot(type, q) { return cv.toDataURL(type || 'image/png', q); },
};

/* ---------------- Loop ---------------- */
function resize() {
  const vw = innerWidth, vh = innerHeight, dpr = PROMO ? 1 : Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  const cs = getComputedStyle(document.documentElement), px = n => parseFloat(cs.getPropertyValue(n)) || 0;
  const padX = Math.max(px('--sl'), px('--sr')), padY = Math.max(px('--st'), px('--sb'));
  const rot = vh > vw, long = rot ? vh : vw, short = rot ? vw : vh;
  const padL = rot ? padY : padX, padS = rot ? padX : padY;
  const s = Math.min((long - 2 * padL) / W, (short - 2 * padS) / H);
  view = { s, rot, vw, vh, dpr, ox: (long - W * s) / 2, oy: (short - H * s) / 2, flip: rot && view.flip };
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));

let last = 0, acc = 0;
function frame(t) {
  if (PROMO) return;                   // in vetrina i fotogrammi li comanda lo script
  const dt = Math.min(0.05, (t - last) / 1000 || 0); last = t; acc += dt;
  let n = 0;
  while (acc >= DT && n < 3) { if (!paused()) physicsStep(); acc -= DT; n++; }
  if (n === 3) acc = 0;
  draw();
  requestAnimationFrame(frame);
}

resize();
loadLevel(curLevel);
requestAnimationFrame(frame);
initPlatform().then(() => {
  readSave(); reportProgress();
  if (state === 'start') loadLevel(curLevel);
});

// per debug / test
window.__game = { get state() { return state; }, get rings() { return rings; }, fishes, get timeLeft() { return timeLeft; }, get result() { return result; },
  pumps, step: physicsStep, motion(o, m) { if (o) onOrient(o); if (m) onMotion(m); }, get acc() { return [accX, accY, view.flip]; }, down: pumpDown, up: pumpUp, start(i) { startLevel(i || 0); }, load: loadLevel, get cg() { return CG; }, get plat() { return PLAT; }, get gd() { return GD; }, gesture: onGesture, save, endButtons, get adPlaying() { return adPlaying; } };
</script>
